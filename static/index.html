<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Summarizer - Обработка видеозаписей встреч</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Yandex Sans Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: #000000;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .header p {
            font-size: 1.1rem;
            color: #666666;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .upload-section {
            text-align: center;
        }

        .drop-zone {
            border: 2px dashed #d0d0d0;
            border-radius: 8px;
            padding: 60px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #ffffff;
        }

        .drop-zone:hover, .drop-zone.drag-over {
            background: #f9f9f9;
            border-color: #0077FF;
        }

        .drop-zone-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .drop-zone-text {
            font-size: 1.2rem;
            color: #000000;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .drop-zone-hint {
            color: #666;
            font-size: 0.9rem;
        }

        .file-input {
            display: none;
        }

        .prompt-section {
            margin-top: 30px;
            background: #f9f9f9;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #e0e0e0;
        }

        .prompt-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            user-select: none;
            margin-bottom: 0;
            transition: all 0.2s ease;
        }

        .prompt-header:hover .prompt-title {
            color: #0077FF;
        }

        .prompt-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            color: #666;
            font-size: 0.95rem;
            transition: color 0.2s ease;
        }

        .prompt-toggle {
            color: #999;
            font-size: 1rem;
            transition: transform 0.3s ease, color 0.2s ease;
        }

        .prompt-toggle.collapsed {
            transform: rotate(-90deg);
        }

        .prompt-header:hover .prompt-toggle {
            color: #0077FF;
        }

        .prompt-content {
            max-height: 500px;
            overflow: hidden;
            transition: max-height 0.3s ease, margin-top 0.3s ease;
            margin-top: 15px;
        }

        .prompt-content.collapsed {
            max-height: 0;
            margin-top: 0;
        }

        .prompt-textarea {
            width: 100%;
            min-height: 180px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            resize: vertical;
            transition: all 0.3s;
            line-height: 1.5;
            background: #ffffff;
        }

        .prompt-textarea:focus {
            outline: none;
            border-color: #0077FF;
            box-shadow: 0 0 0 3px rgba(0, 119, 255, 0.1);
        }

        .prompt-actions {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .button-secondary {
            background: #ffffff;
            color: #666;
            border: 1px solid #d0d0d0;
            padding: 8px 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .button-secondary:hover {
            background: #f5f5f5;
            border-color: #0077FF;
            color: #0077FF;
        }

        .button {
            background: #FFCC00;
            color: #000000;
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .button:hover {
            background: #FFB800;
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .progress-section {
            display: none;
            margin-top: 30px;
        }

        .progress-section.active {
            display: block;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 6px solid #e0e0e0;
            border-top-color: #FFCC00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 30px auto;
        }

        .progress-stage {
            text-align: center;
            color: #000000;
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .progress-stage-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }
        
        .progress-details {
            text-align: center;
            color: #666666;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .results-section {
            display: none;
        }

        .results-section.active {
            display: block;
        }

        .result-content {
            padding: 25px;
            background: #ffffff;
            border-radius: 8px;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
        }

        .result-content.active {
            display: block;
        }

        .result-text {
            white-space: pre-wrap;
            line-height: 1.5;
            color: #333;
            font-size: 1.05rem;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            justify-content: flex-start;
        }
        
        .actions .button {
            padding: 10px 24px;
            font-size: 0.95rem;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8rem;
            }

            .card {
                padding: 20px;
            }

            .drop-zone {
                padding: 40px 15px;
            }

            .actions {
                flex-direction: column;
            }

            .button {
                width: 100%;
            }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Стили для tooltip подсказок */
        .help-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #e0e0e0;
            color: #666;
            font-size: 11px;
            font-weight: 600;
            cursor: help;
            margin-left: 6px;
            position: relative;
            transition: all 0.2s ease;
            border: 1px solid #d0d0d0;
        }

        .help-icon:hover {
            background: #d0d0d0;
            color: #333;
            border-color: #999;
            transform: scale(1.05);
        }

        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: #2c2c2c;
            color: #f5f5f5;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            pointer-events: none;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .tooltip::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: #2c2c2c;
        }

        .help-icon:hover .tooltip,
        .tooltip:hover {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-12px);
            pointer-events: auto;
        }

        /* Добавляем невидимый мост между иконкой и tooltip */
        .help-icon::before {
            content: '';
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            height: 20px;
            z-index: 999;
        }

        .tooltip a {
            color: #FFD54F;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .tooltip a:hover {
            color: #FFC107;
            text-decoration: underline;
        }

        .field-label {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-weight: 500;
            color: #333;
        }

        /* Стили для кнопки выхода */
        .logout-button {
            background: #ffffff;
            color: #ff4444;
            border: 1px solid #ff4444;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: none;
        }

        .logout-button:hover {
            background: #ff4444;
            color: #ffffff;
        }

        .logout-button.visible {
            display: inline-block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Meeting Summarizer</h1>
            <p>Автоматическая транскрибация и суммаризация видеозаписей встреч</p>
        </div>

        <div class="card">
            <div class="upload-section" id="uploadSection">
                <div class="drop-zone" id="dropZone">
                    <div class="drop-zone-icon">📁</div>
                    <div class="drop-zone-text">Перетащите видео файл сюда</div>
                    <div class="drop-zone-hint">или нажмите для выбора файла</div>
                    <div class="drop-zone-hint" style="margin-top: 10px;">Поддерживаются: MP4, WebM (макс. 1GB, 4 часа)</div>
                </div>
                <input type="file" id="fileInput" class="file-input" accept=".mp4,.webm">

                <div class="prompt-section">
                    <div class="prompt-header" id="promptHeader">
                        <div class="prompt-title">
                            <span>Настройки промпта</span>
                            <span style="color: #999; font-size: 0.85rem; font-weight: normal;">(опционально)</span>
                        </div>
                        <span class="prompt-toggle collapsed" id="promptToggle">▼</span>
                    </div>
                    <div class="prompt-content collapsed" id="promptContent">
                        <textarea
                            class="prompt-textarea"
                            id="systemPrompt"
                            placeholder="Загрузка промпта..."
                        ></textarea>
                        <div class="prompt-actions">
                            <button class="button-secondary" id="resetPromptButton">
                                Сбросить к умолчанию
                            </button>
                        </div>
                    </div>
                </div>

                <div class="actions" style="margin-top: 30px;">
                    <button class="button" id="uploadButton" disabled>
                        Загрузить и обработать
                    </button>
                    <button class="logout-button" id="logoutButton">
                        Выйти
                    </button>
                </div>

                <div class="error-message" id="errorMessage"></div>
            </div>

            <div class="progress-section" id="progressSection">
                <div class="progress-stage" id="progressStage">
                    <div class="progress-stage-icon">⏳</div>
                    <div>Загрузка файла...</div>
                </div>
                <div class="loading-spinner"></div>
            </div>

            <div class="results-section" id="resultsSection">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2 style="margin: 0; color: #000000; font-weight: 500;">Резюме встречи</h2>
                    <div class="actions" style="margin: 0;">
                        <button class="button" id="copyButton">
                            Копировать
                        </button>
                        <button class="button" id="newTaskButton" style="background: #ffffff; color: #0077FF; border: 1px solid #0077FF;">
                            Обработать новый файл
                        </button>
                    </div>
                </div>
                
                <div class="result-content active" id="summaryContent">
                    <div class="result-text" id="summaryText"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let currentTaskId = null;
        let selectedFile = null;
        let defaultPrompt = '';
        let currentPrompt = '';
        let sessionId = null;
        let hasDefaultKeys = false;
        const API_BASE = '';

        // Элементы DOM
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadButton = document.getElementById('uploadButton');
        const uploadSection = document.getElementById('uploadSection');
        const progressSection = document.getElementById('progressSection');
        const resultsSection = document.getElementById('resultsSection');
        const progressStage = document.getElementById('progressStage');
        const errorMessage = document.getElementById('errorMessage');
        const summaryText = document.getElementById('summaryText');
        const copyButton = document.getElementById('copyButton');
        const newTaskButton = document.getElementById('newTaskButton');
        const promptHeader = document.getElementById('promptHeader');
        const promptToggle = document.getElementById('promptToggle');
        const promptContent = document.getElementById('promptContent');
        const systemPrompt = document.getElementById('systemPrompt');
        const resetPromptButton = document.getElementById('resetPromptButton');

        // Проверка сессии при загрузке страницы
        async function checkSession() {
            try {
                const response = await fetch(`${API_BASE}/api/session/check`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                hasDefaultKeys = data.has_default_keys;
                
                if (!data.has_session && data.requires_keys) {
                    // Показываем форму ввода ключей
                    showApiKeysForm();
                    logoutButton.classList.remove('visible');
                } else if (!data.has_session) {
                    // Создаем сессию с дефолтными ключами
                    await createSession();
                    logoutButton.classList.remove('visible');
                } else {
                    sessionId = data.session_id;
                    // Показываем кнопку выхода только если используются пользовательские ключи
                    if (!hasDefaultKeys) {
                        logoutButton.classList.add('visible');
                    }
                }
            } catch (error) {
                console.error('Ошибка проверки сессии:', error);
                showError('Ошибка подключения к серверу');
            }
        }

        // Создание сессии
        async function createSession(apiKey = null, folderId = null) {
            try {
                const formData = new FormData();
                if (apiKey) formData.append('api_key', apiKey);
                if (folderId) formData.append('folder_id', folderId);
                
                const response = await fetch(`${API_BASE}/api/session`, {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка создания сессии');
                }
                
                const data = await response.json();
                sessionId = data.session_id;
                hasDefaultKeys = data.has_default_keys;
                
                return true;
            } catch (error) {
                console.error('Ошибка создания сессии:', error);
                throw error;
            }
        }

        // Показ формы ввода API ключей
        function showApiKeysForm() {
            const formHtml = `
                <div style="background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 20px; margin-bottom: 20px;">
                    <h3 style="margin: 0 0 20px 0; color: #856404;">Настройка доступа</h3>
                    <div style="margin-bottom: 15px;">
                        <div class="field-label">
                            <span>API_KEY:</span>
                            <span class="help-icon">
                                ?
                                <span class="tooltip">
                                    API ключ сервисного аккаунта<br>
                                    <a href="https://cloud.yandex.ru/docs/iam/operations/api-key/create" target="_blank">Как создать API ключ →</a>
                                </span>
                            </span>
                        </div>
                        <input type="password" id="apiKeyInput" placeholder="AQVNxxxxxxxxxx..."
                            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                            style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace;">
                    </div>
                    <div style="margin-bottom: 15px;">
                        <div class="field-label">
                            <span>FOLDER_ID:</span>
                            <span class="help-icon">
                                ?
                                <span class="tooltip">
                                    ID каталога в Yandex Cloud<br>
                                    <a href="https://cloud.yandex.ru/docs/resource-manager/operations/folder/get-id" target="_blank">Как узнать Folder ID →</a>
                                </span>
                            </span>
                        </div>
                        <input type="password" id="folderIdInput" placeholder="b1gxxxxxxxxxx..."
                            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                            style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace;">
                    </div>
                    <button onclick="submitApiKeys()" class="button" style="width: 100%;">
                        Сохранить и продолжить
                    </button>
                    <div id="keysError" style="display: none; margin-top: 10px; padding: 10px; background: #fee; color: #c33; border-radius: 4px;"></div>
                </div>
            `;
            
            const container = document.querySelector('.upload-section');
            container.insertAdjacentHTML('afterbegin', formHtml);
            
            // Скрываем форму загрузки до ввода ключей
            dropZone.style.display = 'none';
            document.querySelector('.prompt-section').style.display = 'none';
            document.querySelector('.actions').style.display = 'none';
        }

        // Отправка API ключей
        async function submitApiKeys() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            const folderId = document.getElementById('folderIdInput').value.trim();
            const keysError = document.getElementById('keysError');
            const submitButton = event.target;
            
            if (!apiKey || !folderId) {
                keysError.textContent = 'Пожалуйста, заполните оба поля';
                keysError.style.display = 'block';
                return;
            }
            
            try {
                // Показываем индикатор загрузки
                submitButton.disabled = true;
                submitButton.innerHTML = '<span class="spinner"></span> Проверка ключей...';
                keysError.style.display = 'none';
                
                // Валидируем ключи
                const formData = new FormData();
                formData.append('api_key', apiKey);
                formData.append('folder_id', folderId);
                
                const validateResponse = await fetch(`${API_BASE}/api/validate-keys`, {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });
                
                if (!validateResponse.ok) {
                    const error = await validateResponse.json();
                    throw new Error(error.detail || 'Ошибка валидации ключей');
                }
                
                // Создаем сессию с валидированными ключами
                await createSession(apiKey, folderId);
                
                // Удаляем форму и показываем интерфейс загрузки
                document.querySelector('.upload-section > div').remove();
                dropZone.style.display = 'block';
                document.querySelector('.prompt-section').style.display = 'block';
                document.querySelector('.actions').style.display = 'flex';
                
                // Показываем кнопку выхода
                logoutButton.classList.add('visible');
                
                hideError();
            } catch (error) {
                keysError.textContent = error.message;
                keysError.style.display = 'block';
                submitButton.disabled = false;
                submitButton.textContent = 'Сохранить и продолжить';
            }
        }

        // Загрузка системного промпта при старте
        async function loadSystemPrompt() {
            try {
                const response = await fetch(`${API_BASE}/api/prompt`, {
                    credentials: 'include'
                });
                const data = await response.json();
                defaultPrompt = data.prompt;
                currentPrompt = defaultPrompt;
                systemPrompt.value = defaultPrompt;
            } catch (error) {
                console.error('Ошибка загрузки промпта:', error);
                systemPrompt.placeholder = 'Ошибка загрузки промпта';
            }
        }

        // Инициализация при загрузке страницы
        async function init() {
            // Сначала проверяем/создаем сессию
            await checkSession();
            // Только после успешной инициализации сессии загружаем промпт
            await loadSystemPrompt();
        }

        // Вызываем инициализацию при старте
        init();

        // Обработчик кнопки "Выйти"
        const logoutButton = document.getElementById('logoutButton');
        
        logoutButton.addEventListener('click', async () => {
            if (!confirm('Вы уверены, что хотите выйти? Текущая сессия будет завершена.')) {
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/api/session/logout`, {
                    method: 'POST',
                    credentials: 'include'  // Важно для отправки cookies
                });
                
                if (response.ok) {
                    // Перезагружаем страницу для повторного ввода ключей
                    window.location.reload();
                } else {
                    const errorData = await response.json().catch(() => ({}));
                    console.error('Logout error:', errorData);
                    showError(`Ошибка при выходе: ${errorData.detail || response.statusText}`);
                }
            } catch (error) {
                console.error('Ошибка выхода:', error);
                showError(`Ошибка при выходе из сессии: ${error.message}`);
            }
        });

        // Переключение видимости промпта
        promptHeader.addEventListener('click', () => {
            promptContent.classList.toggle('collapsed');
            promptToggle.classList.toggle('collapsed');
        });

        // Сброс промпта к умолчанию
        resetPromptButton.addEventListener('click', () => {
            systemPrompt.value = defaultPrompt;
            currentPrompt = defaultPrompt;
        });

        // Отслеживание изменений промпта
        systemPrompt.addEventListener('input', () => {
            currentPrompt = systemPrompt.value;
        });


        // Обработка drag & drop
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });

        // Обработка выбора файла
        function handleFileSelect(file) {
            const validExtensions = ['.mp4', '.webm'];
            const fileExt = '.' + file.name.split('.').pop().toLowerCase();
            
            if (!validExtensions.includes(fileExt)) {
                showError('Неподдерживаемый формат файла. Используйте MP4 или WebM.');
                return;
            }

            const MAX_FILE_SIZE = 1024 * 1024 * 1024; // 1GB
            if (file.size > MAX_FILE_SIZE) {
                showError('Размер файла превышает 1GB.');
                return;
            }

            selectedFile = file;
            dropZone.querySelector('.drop-zone-text').textContent = `Выбран: ${file.name}`;
            dropZone.querySelector('.drop-zone-hint').textContent = `Размер: ${(file.size / (1024 * 1024)).toFixed(2)} MB`;
            uploadButton.disabled = false;
            hideError();
        }

        // Загрузка и обработка файла
        uploadButton.addEventListener('click', async () => {
            if (!selectedFile) return;

            const formData = new FormData();
            formData.append('file', selectedFile);
            
            // Добавляем промпт, если он был изменен
            if (currentPrompt && currentPrompt !== defaultPrompt) {
                formData.append('system_prompt', currentPrompt);
            }

            try {
                // Проверяем наличие сессии
                if (!sessionId && !hasDefaultKeys) {
                    showError('Необходимо ввести API ключи');
                    return;
                }
                uploadButton.disabled = true;
                uploadButton.innerHTML = '<span class="spinner"></span> Загрузка...';

                const response = await fetch(`${API_BASE}/api/upload`, {
                    method: 'POST',
                    body: formData,
                    credentials: 'include'
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.detail || 'Ошибка загрузки');
                }

                const data = await response.json();
                currentTaskId = data.task_id;

                // Переключаемся на отображение прогресса
                uploadSection.style.display = 'none';
                progressSection.classList.add('active');

                // Начинаем отслеживание статуса
                pollTaskStatus();

            } catch (error) {
                showError(error.message);
                uploadButton.disabled = false;
                uploadButton.textContent = 'Загрузить и обработать';
            }
        });

        // Отслеживание статуса задачи
        async function pollTaskStatus() {
            if (!currentTaskId) return;

            try {
                const response = await fetch(`${API_BASE}/api/status/${currentTaskId}`, {
                    credentials: 'include'
                });
                const data = await response.json();

                updateProgress(data);

                if (data.status === 'completed') {
                    await showResults();
                } else if (data.status === 'error') {
                    showError(data.error || 'Произошла ошибка при обработке');
                    resetToUpload();
                } else {
                    // Продолжаем опрос
                    setTimeout(pollTaskStatus, 1000);
                }

            } catch (error) {
                showError('Ошибка получения статуса: ' + error.message);
                resetToUpload();
            }
        }

        // Обновление прогресса
        function updateProgress(data) {
            const stages = {
                'upload': {
                    icon: '📤',
                    text: 'Загрузка файла...',
                    detail: 'Файл загружается на сервер'
                },
                'extract_audio': {
                    icon: '🎵',
                    text: 'Извлечение аудио...',
                    detail: 'Извлечение аудиодорожки из видео'
                },
                'transcribe': {
                    icon: '🎤',
                    text: 'Транскрибация и суммаризация...',
                    detail: 'Распознавание речи и создание резюме (это может занять несколько минут)'
                },
                'completed': {
                    icon: '✅',
                    text: 'Обработка завершена!',
                    detail: 'Все готово!'
                }
            };

            const stage = stages[data.stage] || { icon: '⏳', text: 'Обработка...', detail: '' };
            progressStage.innerHTML = `
                <div class="progress-stage-icon">${stage.icon}</div>
                <div>${stage.text}</div>
                <div class="progress-details">${stage.detail}</div>
            `;
        }

        // Отображение результатов
        async function showResults() {
            try {
                const response = await fetch(`${API_BASE}/api/result/${currentTaskId}`, {
                    credentials: 'include'
                });
                const data = await response.json();

                // Отображаем резюме как простой текст
                summaryText.textContent = data.summary || 'Резюме не создано';

                progressSection.classList.remove('active');
                resultsSection.classList.add('active');

            } catch (error) {
                showError('Ошибка получения результатов: ' + error.message);
                resetToUpload();
            }
        }

        // Копирование резюме в буфер обмена
        copyButton.addEventListener('click', async () => {
            try {
                // Получаем текст напрямую из элемента (он уже в нужном формате)
                const summaryElement = document.getElementById('summaryText');
                const textContent = summaryElement.textContent;
                
                // Пробуем современный API (работает только на HTTPS/localhost)
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(textContent);
                } else {
                    // Fallback для HTTP: используем старый метод с textarea
                    const textarea = document.createElement('textarea');
                    textarea.value = textContent;
                    textarea.style.position = 'fixed';
                    textarea.style.left = '-999999px';
                    textarea.style.top = '-999999px';
                    document.body.appendChild(textarea);
                    textarea.focus();
                    textarea.select();
                    
                    try {
                        document.execCommand('copy');
                        textarea.remove();
                    } catch (err) {
                        textarea.remove();
                        throw new Error('Не удалось скопировать текст');
                    }
                }
                
                // Показываем уведомление
                const originalText = copyButton.innerHTML;
                copyButton.innerHTML = '✓ Скопировано';
                copyButton.style.background = '#4CAF50';
                
                setTimeout(() => {
                    copyButton.innerHTML = originalText;
                    copyButton.style.background = '#FFCC00';
                }, 2000);
                
            } catch (error) {
                console.error('Ошибка копирования:', error);
                copyButton.innerHTML = '✗ Ошибка';
                copyButton.style.background = '#f44336';
                setTimeout(() => {
                    copyButton.innerHTML = 'Копировать';
                    copyButton.style.background = '#FFCC00';
                }, 2000);
            }
        });

        // Новая задача
        newTaskButton.addEventListener('click', () => {
            resetToUpload();
        });

        // Сброс к начальному состоянию
        function resetToUpload() {
            selectedFile = null;
            currentTaskId = null;
            
            uploadSection.style.display = 'block';
            progressSection.classList.remove('active');
            resultsSection.classList.remove('active');
            
            dropZone.querySelector('.drop-zone-text').textContent = 'Перетащите видео файл сюда';
            dropZone.querySelector('.drop-zone-hint').textContent = 'или нажмите для выбора файла';
            
            uploadButton.disabled = true;
            uploadButton.textContent = 'Загрузить и обработать';
            
            fileInput.value = '';
        }

        // Показ ошибки
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('active');
        }

        // Скрытие ошибки
        function hideError() {
            errorMessage.classList.remove('active');
        }

    </script>
</body>
</html>
